<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGP | Iniciar sesión</title><link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">SG</div>
    <p class="eyebrow">SISTEMA DE GESTIÓN</p>
    <h1>Bienvenido de nuevo</h1>
    <p class="muted">Inicia sesión para administrar tu inventario.</p>
    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="tu@correo.com" required autocomplete="email">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" placeholder="Tu contraseña" required autocomplete="current-password">
      <button type="submit">Iniciar sesión <span>→</span></button>
    </form>
    <p id="message" class="message" role="status"></p>
    <p class="switch">¿No tienes cuenta? <a href="/register.html">Crear cuenta</a></p>
  </main>
  <script src="/auth.js"></script>
</body></html>
